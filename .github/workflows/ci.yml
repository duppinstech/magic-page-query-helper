# Syntax check and the release-notes check. This plugin has no Composer or PHPUnit project.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax lint
        run: find . -path ./build -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      # Same script the release workflow runs: fails if the current version has no changelog section
      # (readme.txt "= x.y.z =" under == Changelog ==, or CHANGELOG.md "## [x.y.z]" not marked Unreleased).
      - name: Release notes for the current version
        if: matrix.php == '8.2'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' magic-page-query-helper.php | tr -d '\r')
          bash bin/release-notes.sh "$version" magic-page-query-helper.php "$RUNNER_TEMP/release-notes.md"
